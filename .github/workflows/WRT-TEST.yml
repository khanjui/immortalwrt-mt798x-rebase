name: Chasey ImmortalWrt - AX3000T

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/WRT-TEST.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Xiaomi AX3000T
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: AX3000T
      WRT_REPO: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
      WRT_BRANCH: 25.12
      WRT_SOURCE: chasey-dev/immortalwrt-mt798x-rebase
